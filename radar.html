<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>技能雷达图</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #eef2ff 0%, #f8fafc 50%, #e0f2fe 100%);
            padding: 24px;
        }

        .control-panel {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 16px 20px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(59, 130, 246, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        .control-panel label {
            font-size: 14px;
            font-weight: 600;
            color: #334155;
            white-space: nowrap;
        }

        .control-panel input {
            width: 260px;
            padding: 10px 14px;
            font-size: 15px;
            font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
            color: #1e293b;
            border: 1.5px solid #cbd5e1;
            border-radius: 10px;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
            background: #ffffff;
        }

        .control-panel input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        .control-panel button {
            padding: 10px 22px;
            font-size: 15px;
            font-weight: 600;
            color: #ffffff;
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
        }

        .control-panel button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.4);
        }

        .control-panel button:active {
            transform: translateY(0);
        }

        .chart-container {
            width: min(560px, 92vw);
            height: min(560px, 72vh);
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 24px;
            box-shadow: 0 16px 48px rgba(15, 23, 42, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.7);
            padding: 12px;
        }

        .error-tip {
            display: none;
            margin-top: 14px;
            font-size: 13px;
            color: #ef4444;
            background: rgba(254, 242, 242, 0.9);
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid #fecaca;
        }
    </style>
</head>
<body>
    <div class="control-panel">
        <label for="scoreInput">评分（1-5，逗号分隔）</label>
        <input type="text" id="scoreInput" value="4,3,4,4,3" placeholder="例：4,3,4,4,3" autocomplete="off">
        <button id="generateBtn">生成雷达图</button>
    </div>

    <div class="chart-container" id="chart"></div>

    <div class="error-tip" id="errorTip"></div>

    <script>
        const chartDom = document.getElementById('chart');
        const myChart = echarts.init(chartDom);
        const dimensions = ['Real-World', 'Inquiry', 'Scaffolding', 'Assessment', 'Collaboration'];

        function parseScores(input) {
            const parts = input.split(',').map(s => s.trim());
            if (parts.length !== 5) {
                throw new Error('请输入 5 个数字，用逗号分隔（如：4,3,4,4,3）');
            }
            const scores = parts.map(s => {
                const n = Number(s);
                if (!/^\d+$/.test(s) || n < 1 || n > 5) {
                    throw new Error('每个值必须是 1-5 之间的整数');
                }
                return n;
            });
            return scores;
        }

        function buildOption(scores) {
            return {
                title: {
                    text: '学习能力雷达图',
                    subtext: 'PBL 五大核心维度',
                    left: 'center',
                    top: 16,
                    textStyle: {
                        fontSize: 18,
                        fontWeight: 700,
                        color: '#1e293b'
                    },
                    subtextStyle: {
                        fontSize: 12,
                        color: '#64748b'
                    }
                },
                tooltip: {
                    trigger: 'item',
                    backgroundColor: 'rgba(15, 23, 42, 0.88)',
                    borderColor: 'rgba(255,255,255,0.1)',
                    textStyle: { color: '#f8fafc' },
                    formatter: function (params) {
                        if (params.seriesType === 'radar') {
                            let lines = params.name + '<br/>';
                            dimensions.forEach((d, i) => {
                                lines += d + '：' + scores[i] + ' 分<br/>';
                            });
                            return lines;
                        }
                        return params.name;
                    }
                },
                legend: {
                    data: ['综合能力'],
                    bottom: 12,
                    icon: 'roundRect',
                    itemWidth: 14,
                    itemHeight: 8,
                    textStyle: { color: '#475569', fontSize: 13 }
                },
                radar: {
                    center: ['50%', '52%'],
                    radius: '66%',
                    indicator: dimensions.map(d => ({ name: d, max: 5 })),
                    axisName: {
                        color: '#334155',
                        fontSize: 14,
                        fontWeight: 600
                    },
                    splitNumber: 5,
                    shape: 'polygon',
                    splitArea: {
                        areaStyle: {
                            color: ['rgba(59, 130, 246, 0.05)', 'rgba(59, 130, 246, 0.10)']
                        }
                    },
                    splitLine: {
                        lineStyle: {
                            color: 'rgba(59, 130, 246, 0.25)',
                            width: 1
                        }
                    },
                    axisLine: {
                        lineStyle: {
                            color: 'rgba(59, 130, 246, 0.4)'
                        }
                    },
                    axisLabel: {
                        color: '#64748b',
                        fontSize: 12
                    }
                },
                series: [{
                    type: 'radar',
                    name: '综合能力',
                    data: [{
                        value: scores,
                        name: '综合能力',
                        symbol: 'circle',
                        symbolSize: 6,
                        lineStyle: {
                            color: '#3b82f6',
                            width: 2
                        },
                        itemStyle: {
                            color: '#3b82f6'
                        },
                        areaStyle: {
                            color: 'rgba(59, 130, 246, 0.30)'
                        }
                    }]
                }]
            };
        }

        function render(scores) {
            myChart.setOption(buildOption(scores), true);
        }

        function handleGenerate() {
            const errorTip = document.getElementById('errorTip');
            try {
                const scores = parseScores(document.getElementById('scoreInput').value);
                errorTip.style.display = 'none';
                render(scores);
            } catch (e) {
                errorTip.textContent = e.message;
                errorTip.style.display = 'block';
            }
        }

        document.getElementById('generateBtn').addEventListener('click', handleGenerate);
        document.getElementById('scoreInput').addEventListener('keydown', function (e) {
            if (e.key === 'Enter') {
                handleGenerate();
            }
        });

        // 默认渲染
        render([4, 3, 4, 4, 3]);

        // 窗口尺寸变化时自适应
        window.addEventListener('resize', function () {
            myChart.resize();
        });
    </script>
</body>
</html>
